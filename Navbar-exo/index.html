<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"

      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>Navbar</title>
  </head>
  <body>
    <header>
      <div class="navbar">
        <div class="logo"><a href="#">AkaTh</a></div>
        <ul class="links">
          <li><a href="hero">Accueil</a></li>
          <li><a href="media">Media</a></li>
          <li><a href="about">A propos</a></li>
          <li><a href="contact">Contact</a></li>
        </ul>
        <div class="btn">
          <a href="#" class="action-btn pro">Espace Pro</a>
          <a href="#" class="action-btn">Se Connecter</a>
        </div>
        <div class="burger-menu-btn">
          <i class="fa-solid fa-burger"></i>
        </div>
      </div>
      <div class="burger-menu">
        <ul class="links">
          <li><a href="hero">Accueil</a></li>
          <li><a href="media">Media</a></li>
          <li><a href="about">A propos</a></li>
          <li><a href="contact">Contact</a></li>
          <div class="divider"></div>
          <div class="btn-burger-menu">
            <a href="#" class="action-btn pro">Espace Pro</a>
            <a href="#" class="action-btn">Se Connecter</a>
          </div>
        </ul>
      </div>

    <script src="app.js"></script>

</html>
